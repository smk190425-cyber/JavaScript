<!DOCTYPE html>
<html>
<head>
    <title>Show and Hide</title>

    <style>
        .show{
            color:rgb(70, 243, 70);
        }                           
        .hide{
            color:rgb(240, 22, 22); 
        }
    </style>
</head>
<body>
    <button id="show">show</button>
    <label id="showlabel"></label>
<script>
    var boolean;
    const button=document.getElementById('show');
    const label=document.getElementById('showlabel');
    button.addEventListener('click', function(){
        boolean=!boolean;
        label.textContent=`${boolean?"label is visible":"label is hide"}`;
        label.className=`${boolean?"show":'hide'}`
 
</script>



</body>
</html>
